services:
    app:
        build:
            context: .
        container_name: dormdash-app
        image: dormdash-app:latest
    #    user: "${UID}:${GID}"
        depends_on:
            db:
                condition: service_healthy
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - APP_ENV=production
            - DB_HOST=db
            - DB_DATABASE=dormdash_db_v4
            - DB_USERNAME=root
            - DB_PASSWORD=pass
        restart: unless-stopped
        entrypoint: ["/bin/sh", "/var/www/docker/maria-db/entrypoint.sh"]
        command: ["php-fpm", "-F"]
        volumes:
            - .:/var/www
        networks:
            - laravel

    nginx:
        image: nginx:alpine
        container_name: dormdash-nginx-laravel
        volumes:
            - .:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
            - /etc/letsencrypt:/etc/letsencrypt:ro
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - app
        networks:
            - laravel

    db:
        image: mysql:8.0
        container_name: dormdash-db
        restart: always
        ports:
            - "3307:3306" #3307 so it doesn't conflict with your host
        environment:
            MYSQL_ROOT_PASSWORD: pass
            MYSQL_DATABASE: dormdash_db_v4
        volumes:
            - dbdata:/var/lib/mysql
            - ./database/init:/docker-entrypoint-initdb.d
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppass" ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - laravel
    node:
        image: node:20-alpine
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                reservations:
                    cpus: '0.25'
        container_name: dormdash-node
        working_dir: /var/www
        volumes:
            - .:/var/www
        command: sh -c "npm install && npm run build"
        ports:
            - "5173:5173"
        networks:
            - laravel
        environment:
            CHOKIDAR_USEPOLLING: "true"
        build:
            context: .
            dockerfile: Dockerfile.node
    mailpit:
        image: axllent/mailpit:latest
        container_name: dormdash-mailpit
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - laravel

    ai:
        image: python:3.11-slim
        container_name: dormdash-ai
        command: sh -c "pip install -q fastapi uvicorn pandas scikit-learn sqlalchemy pymysql && uvicorn app.AI.main:app --host 0.0.0.0 --port 5000"
        working_dir: /var/www
        environment:
        - AI_DB_URL=mysql+pymysql://root:pass@db:3306/dormdash_db_v4
        volumes:
            - .:/var/www
        ports:
            - "5000:5000"
        networks:
        - laravel
networks:
    laravel:
        name: laravel
        driver: bridge
        external: false

volumes:
    dbdata:
