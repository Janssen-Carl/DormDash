services:
    app:
        build:
            context: .
        container_name: dormdash-app
        image: dormdash-app:latest
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - .:/var/www
        networks:
            - laravel

    nginx:
        image: nginx:alpine
        container_name: dormdash-nginx-laravel
        volumes:
            - .:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
        ports:
            - "8080:80"
        depends_on:
            - app
        networks:
            - laravel

    db:
        image: mysql:8.0
        container_name: dormdash-db
        restart: always
        ports:
            - "3307:3306" #3307 so it doesn't conflict with your host
        environment:
            MYSQL_ROOT_PASSWORD: pass
            MYSQL_DATABASE: dormdash_db_v3
        volumes:
            - dbdata:/var/lib/mysql
            - ./database/init:/docker-entrypoint-initdb.d
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppass" ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - laravel

    node:
        image: node:20-alpine
        working_dir: /var/www
        volumes:
            - .:/var/www
        command: sh -c "npm install && npm run dev" # change to build when prod

networks:
    laravel:

volumes:
    dbdata:

