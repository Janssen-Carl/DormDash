# ======================================================
# WAF - HTTP-level directives (maps, rate limit zones)
# Auto-included at http block by nginx:alpine default.conf
# ======================================================

# ---- Rate Limiting Zones ----
limit_req_zone $binary_remote_addr zone=waf_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=waf_global:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=waf_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=waf_strict:10m rate=10r/m;

# ---- Request Body Size ----
client_body_buffer_size 16k;
client_max_body_size 5m;

# ---- Malicious URI Patterns (will block at the server level) ----
map $uri $waf_blocked_uri {
    default 0;
    ~*(\/\.env) 1;
    ~*(\/\.git) 1;
    ~*(\/\.svn) 1;
    #~*(\/vendor\/) 1;
    ~*(\/storage\/logs\/) 1;
    ~*(phpmyadmin) 1;
    ~*(pma) 1;
    ~*(administrator) 1;
    ~*(wp-admin) 1;
    ~*(wp-content) 1;
    ~*(myadmin) 1;
    ~*(owa\/) 1;
    ~*(webdav) 1;
    ~*(cgi-bin) 1;
    ~*(muieblackcat) 1;
    ~*(etc\/passwd) 1;
}

# ---- Malicious Query String Patterns ----
map $query_string $waf_blocked_query {
    default 0;
    ~*(union.*select) 1;
    ~*(union.*all.*select) 1;
    ~*(select.*from) 1;
    ~*(insert.*into) 1;
    ~*(drop.*table) 1;
    ~*(delete.*from) 1;
    ~*(update.*set) 1;
    ~*(create.*table) 1;
    ~*(alter.*table) 1;
    ~*(truncate.*table) 1;
    ~*(\/\*.*\*\/) 1;                 # inline SQL comments
    ~*(exec\s*\() 1;
    ~*(xp_cmdshell) 1;
    ~*(pg_sleep) 1;
    ~*(waitfor.*delay) 1;
    ~*(benchmark.*rand) 1;
    ~*(sleep\s*\() 1;
    ~*(<script) 1;
    ~*(javascript:) 1;
    ~*(onerror\s*=) 1;
    ~*(onload\s*=) 1;
    ~*(onclick\s*=) 1;
    ~*(onmouseover\s*=) 1;
    ~*(alert\s*\() 1;
    ~*(prompt\s*\() 1;
    ~*(confirm\s*\() 1;
    ~*(document\.cookie) 1;
    ~*(window\.location) 1;
    ~*(eval\s*\() 1;
    ~*(base64_decode) 1;
    ~*(\benv\b) 1;
    ~*(file_get_contents) 1;
    ~*(passthru\s*\() 1;
    ~*(system\s*\() 1;
    ~*(shell_exec) 1;
    ~*(exec\s*\() 1;
    ~*(\bcmd\b) 1;
    ~*(wget\s+http) 1;
    ~*(curl\s+http) 1;
    ~*(\.\.\/\.\.\/) 1;               # path traversal
    ~*(\%00) 1;
    ~*(\bHAVING\b) 1;
    ~*(information_schema) 1;
}

# ---- Malicious User-Agent Patterns ----
map $http_user_agent $waf_bad_bot {
    default 0;
    ~*(sqlmap) 1;
    ~*(nikto) 1;
    ~*(nmap) 1;
    ~*(wpscan) 1;
    ~*(acunetix) 1;
    ~*(nessus) 1;
    ~*(openvas) 1;
    ~*(burp) 1;
    ~*(masscan) 1;
    ~*(zap) 1;
    ~*(hydra) 1;
    ~*(medusa) 1;
    ~*(havij) 1;
    ~*(netsparker) 1;
    ~*(appscan) 1;
    ~*(grabber) 1;
    ~*(webinspect) 1;
    ~*(whatweb) 1;
    ~*(dirbuster) 1;
    ~*(gobuster) 1;
    ~*(w3af) 1;
    ~*(arachni) 1;
    ~*(skipfish) 1;
    ~*(nessus) 1;
    ~*(jorgee) 1;
    ~*(commix) 1;
    ~*(cmseek) 1;
    ~*(legion) 1;
    ~*(python-requests) 1;
    ~*(go-http-client) 1;
    ~*(favicon) 1;                     # favicon crawlers are often scanners
}

# ---- Malicious HTTP Methods ----
map $request_method $waf_bad_method {
    default 0;
    CONNECT 1;
    TRACE 1;
    TRACK 1;
    PUT 1;                             # block PUT in general (no file upload via PUT)
}

# ---- Malicious Headers ----
map $http_x_forwarded_for $waf_blocked_ip {
    default 0;
}

# ---- Tarpit / Slow Attack Detection ----
map $http_range $waf_bad_range {
    default 0;
    ~*,.*, 1;                          # multiple ranges (range header attack)
    ~*[0-9]*-[0-9]*,.*[0-9]*- 1;      # invalid ranges
}
