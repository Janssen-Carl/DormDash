server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    # ---------------- WAF Enforcement ----------------

    # Block bad HTTP methods
    if ($waf_bad_method) {
        return 405;
    }

    # Block malicious URIs
    if ($waf_blocked_uri) {
        return 403;
    }

    # Block malicious query strings
    if ($waf_blocked_query) {
        return 403;
    }

    # Block bad bots / scanners
    if ($waf_bad_bot) {
        return 403;
    }

    # Block range header attacks
    if ($waf_bad_range) {
        return 416;
    }

    # ---- Rate Limiting ----
    limit_req zone=waf_global burst=20 nodelay;

    # ---------------- End WAF Enforcement ----------------

    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.bunny.net; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        # Strict rate limit on login
        location = /login {
            limit_req zone=waf_login burst=3 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Rate limit on API-like endpoints
        location ~ ^/(api|livewire)/ {
            limit_req zone=waf_api burst=10 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        if ($request_method = OPTIONS ) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
